<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="FIRAS TV — تجربة مشاهدة القنوات والبث المباشر على Android">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>فيراس</title>
<style>
/* ===== base ===== */
:root{--bg:#000;--sel:#2b2b2b;--pane:#121212;--red:#e53935;--mu:#9a9a9a;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:#fff;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#hd{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;direction:ltr}
#hb{font-size:32px;font-weight:900;color:var(--red);letter-spacing:-1px;user-select:none}
#hs{width:44px;height:44px;color:#fff}#hs svg,#bn svg{width:100%;height:100%}
#tabs{flex:0 0 auto;display:flex;gap:26px;padding:6px 18px 0;direction:ltr;overflow-x:auto;scrollbar-width:none}
#tabs button{padding:10px 2px;font-size:17px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.on{color:#fff;border-color:#fff}
#pages{flex:1;min-height:0;position:relative}
.pg{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:110px}
.pg.on{display:block}
#pgCh.on{display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
#app.inch #hd,#app.inch #tabs,#app.inch #bn{display:none}
#bn{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:74px;border-radius:38px;background:rgba(30,30,30,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:50;direction:ltr;border:1px solid #2a2a2a}
#bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;min-width:66px;padding:0 14px;border-radius:30px;color:var(--mu);font-size:12px;font-weight:600}
#bn button .i{width:28px;height:28px;display:block}
#bn button.on{background:#383838;color:#fff;font-weight:800}
#plSlot{flex:0 0 auto}
#ovp{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:120;background:#000;display:none;flex-direction:column;justify-content:stretch;align-items:stretch;overflow:hidden}
#ovp.on{display:flex}
/* In the floating player overlay, use the entire viewport instead of a centered 16:9 box */
#ovp #pl{width:100%;height:100%;height:100dvh;max-height:none;aspect-ratio:auto;flex:1 1 auto}
#ovp #pl video{width:100%;height:100%;object-fit:contain}
#pl:fullscreen,#pl:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto;background:#000}
#pl:fullscreen video,#pl:-webkit-full-screen video{width:100%;height:100%;object-fit:contain}
#bk2{position:absolute;top:8px;left:8px;width:36px;height:36px;padding:5px;z-index:4;color:#fff}
#bk2 svg{width:100%;height:100%;fill:#fff}
.sq{display:block;width:calc(100% - 32px);margin:10px 16px 14px;padding:13px 16px;border-radius:14px;border:1px solid #2a2a2a;background:#141414;color:#fff;font-size:16px;outline:none;direction:auto}
.sq:focus{border-color:var(--red)}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px 4px;scrollbar-width:none;direction:ltr}
.sl{flex:0 0 80%;scroll-snap-align:center;position:relative;height:min(60vh,520px);border-radius:24px;overflow:hidden;background:#1a1a1a;border:1px solid #333}
.sl .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl .lgb{position:absolute;left:18%;right:18%;top:14%;aspect-ratio:16/9;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:12px}
.sl .lgb img{max-width:100%;max-height:100%;object-fit:contain}
.sl .sh2{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000e)}
.sl .si{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sl .si b{font-size:26px;font-weight:900;line-height:1.2}.sl .si small{color:#bbb;font-size:14px}
.sl .bs{display:flex;gap:10px;width:100%;direction:rtl;margin-top:6px}
.bw{flex:1;background:#fff;color:#000;border-radius:12px;padding:14px 6px;font-weight:800;font-size:15px}
.bt2{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:14px 6px;font-weight:800;font-size:15px;backdrop-filter:blur(6px)}
.rh{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin:24px 0 12px;direction:rtl}
.rh h3{font-size:20px;font-weight:800}.rh button{font-size:26px;color:#fff;padding:0 4px}
.hr{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;direction:ltr}
.pc{flex:0 0 130px;cursor:pointer}
.pc .pw{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:6px}
.pc .pw img{width:100%;height:100%;object-fit:cover}
.pc .pt{margin-top:6px;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.cc{flex:0 0 120px;cursor:pointer}
.cc .cl{aspect-ratio:16/9;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.cc .cl img{max-width:100%;max-height:100%;object-fit:contain}
.cc .cl.ph{color:#fff;font-weight:800;font-size:20px}
.cc .cn{margin-top:6px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:0 16px;direction:ltr}
.gd .pc,.gd .cc{flex:none}
.lst{padding:0 10px}
.lst h3.sec{font-size:15px;color:var(--mu);margin:14px 8px 8px}
.mi{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:0 16px 10px;padding:16px;border-radius:16px;background:#141414;font-weight:700;font-size:16px;text-align:right;direction:rtl}
.mi small{color:var(--mu);font-weight:600}
.mi.on small{color:var(--ok)}
.pgt{font-size:24px;font-weight:900;padding:14px 18px 6px}
@media(orientation:landscape) and (max-height:500px){#pgCh.on{flex-direction:row}#pl{width:58%;height:100%;aspect-ratio:auto}#plSlot{width:58%}#plSlot #pl{width:100%}#body{flex:1}#cats{flex-basis:34%}}

/* ===== player ===== */
#pl{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto;overflow:hidden}
#pl:fullscreen{aspect-ratio:auto;height:100%}
video{width:100%;height:100%;object-fit:contain;background:#000}
#idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,#2a0a0c,#000 70%);text-align:center;padding:12px}
#idle b{font-size:28px;color:var(--red);letter-spacing:1px;user-select:none}
#idle span{color:var(--mu);font-size:13px}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:700;line-height:1.8;background:#000a;z-index:2;white-space:pre-line}
.ctl{position:absolute;inset:0;z-index:3;transition:opacity .25s;background:linear-gradient(#0008,transparent 30%,transparent 60%,#000a)}
.ctl.off{opacity:0;pointer-events:none}
.ctl button{position:absolute;display:flex;align-items:center;justify-content:center}
.ctl svg{width:100%;height:100%;fill:#fff}
#bk{top:8px;left:8px;width:34px;height:34px;padding:5px}
#ttl{position:absolute;top:12px;left:52px;right:12px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
#pp{left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%)}
#pv{left:18%;top:50%;width:40px;height:40px;transform:translateY(-50%)}
#nx{right:18%;top:50%;width:40px;height:40px;transform:translateY(-50%)}
#lv{left:12px;bottom:46px;background:var(--red);border-radius:8px;padding:5px 12px;font-weight:800;font-size:14px;display:none}
.bar{position:absolute;left:12px;right:64px;bottom:20px;height:22px;display:flex;align-items:center;direction:ltr}
.bar input{width:100%;accent-color:#fff;height:4px}
#fs{right:12px;bottom:12px;width:36px;height:36px;padding:4px}

/* ===== browser: categories (left) + channels (right) ===== */
#body{flex:1;min-height:0;display:flex;direction:ltr}
#cats{flex:0 0 37%;max-width:260px;overflow-y:auto;padding:4px 0}
#cats button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;text-align:left;font-weight:700;font-size:17px;border-radius:0 14px 14px 0;white-space:nowrap}
#cats button.on{background:var(--sel)}
#cats .ci{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;overflow:hidden;color:#fff}
#cats span.t{overflow:hidden;text-overflow:ellipsis}
#side{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--pane)}
.sh{display:flex;gap:8px;align-items:center;margin:8px}
#q{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid #2a2a2a;background:#000;color:#fff;font-size:15px;outline:none;direction:auto}
#q:focus{border-color:var(--red)}
#wk{flex:0 0 auto;padding:10px 12px;border-radius:12px;border:1px solid #2a2a2a;background:#000;font-weight:700;font-size:13px;color:var(--mu);white-space:nowrap}
#wk.on{background:var(--ok);border-color:var(--ok);color:#000}
#list{flex:1;overflow-y:auto;padding:0 8px 12px}
.ch{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border-radius:14px;text-align:left;cursor:pointer}
.ch.on{background:var(--sel)}
.ch.hd{background:#1c1c1c;position:sticky;top:0;z-index:1;margin-bottom:6px}
.ch.dead{opacity:.45}
.ch .lg{flex:0 0 64px;height:48px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ch .lg img{max-width:100%;max-height:100%;object-fit:contain}
.ch .lg.ph{color:#fff;font-weight:800;font-size:18px}
.ch .lg.fl{background:none;font-size:32px}
.ch .nm{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:auto}
.ch .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}
.ch .st{font-size:22px;color:var(--mu);padding:4px 6px}
.ch .st.f{color:#fbbf24}
.emp{text-align:center;color:var(--mu);padding:40px 16px;line-height:1.9;white-space:pre-line}
.more{display:block;margin:10px auto;padding:10px 22px;border-radius:20px;background:var(--sel);font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:10px 18px;border-radius:22px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:400;max-width:90%;text-align:center}
#toast.show{opacity:1}

/* ===== splash + polish ===== */
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 42%,#3a0b10 0,#120305 45%,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-logo{font-size:64px;font-weight:900;color:var(--red);letter-spacing:-2px;animation:spin 1s cubic-bezier(.2,.9,.3,1.2) both,glow 2.2s ease-in-out .9s infinite}
.sp-tag{color:#cfcfcf;font-size:15px;letter-spacing:.5px;opacity:0;animation:fadeup .8s ease .6s forwards}
.sp-bar{width:150px;height:4px;border-radius:4px;background:#ffffff1f;overflow:hidden;opacity:0;animation:fadeup .6s ease .9s forwards}
.sp-bar i{display:block;height:100%;width:40%;border-radius:4px;background:var(--red);animation:slide 1.1s ease-in-out infinite}
@keyframes spin{from{opacity:0;transform:scale(.4) rotate(-6deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes glow{0%,100%{text-shadow:0 0 12px #e5393555}50%{text-shadow:0 0 34px #e53935cc}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shim{0%{background-position:-200px 0}100%{background-position:200px 0}}
.pg.on{animation:pgin .28s ease}
button,.pc,.cc,.ch{transition:transform .12s ease,background .2s ease}
button:active,.pc:active,.cc:active,.ch:active{transform:scale(.97)}
.skl{background:linear-gradient(90deg,#161616 0,#242424 50%,#161616 100%);background-size:400px 100%;animation:shim 1.2s linear infinite;border-radius:14px}
.sk-hero{flex:0 0 80%;height:min(60vh,520px);border-radius:24px}
.sk-card{flex:0 0 130px;aspect-ratio:2/3}
/* ===== admin panel ===== */
.adm{position:fixed;inset:0;z-index:200;background:#0b0b0b;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px;direction:rtl;display:none}
.adm.show{display:block}
.adm h2{color:var(--red);font-size:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.adm h4{margin:22px 0 8px;color:var(--mu);font-size:14px}
.adm input,.adm textarea,.adm select{width:100%;margin-bottom:8px;padding:12px;border-radius:12px;border:1px solid #2a2a2a;background:#151515;color:#fff;font-size:15px;outline:none}
.adm input[type=checkbox]{width:auto;margin:0 0 0 8px}
.adm textarea{height:100px;direction:ltr;font-family:monospace;font-size:13px}
.adm .u{direction:ltr}
.adm .bt{display:inline-block;margin:0 0 8px 8px;padding:11px 16px;border-radius:12px;background:var(--red);font-weight:800;font-size:14px}
.adm .bt.g{background:#2b2b2b}.adm .bt.d{background:#6d1b1b}
.adm .rw{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #222}
.adm .rw span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.adm .rw small{color:var(--mu);font-size:11px}.adm .rw small.ok{color:var(--ok)}.adm .rw small.bad{color:#ff6b6b}
.adm .rw button{padding:6px 10px;font-size:18px}
.adm .stat{color:var(--mu);font-size:13px;margin-bottom:8px}

/* ===== FIRAS TV mobile premium layer ===== */
:root{--bg:#08090d;--pane:#11131a;--sel:#252936;--red:#e50918;--mu:#a4a8b4;--ok:#42d392;--line:#252936;--surface:#151821}
html,body{background:var(--bg);color:#f7f7fa}
#app{background:radial-gradient(ellipse at 50% -20%,#281016 0,transparent 42%),var(--bg)}
#hd{padding:calc(12px + env(safe-area-inset-top)) 20px 8px}
#hb{font-size:30px;letter-spacing:-1.3px;text-shadow:0 5px 24px #e5091840}
#hs{width:42px;height:42px;border:1px solid #ffffff16;border-radius:15px;background:#ffffff09;padding:9px}
#tabs{gap:24px;padding:5px 20px 0}

#bn button.on{background:linear-gradient(145deg,#3a2028,#29202a);color:#fff;box-shadow:inset 0 0 0 1px #e5091838}
.pg{padding-bottom:112px}
.pgt{font-size:25px;padding:18px 20px 8px}
.rh{padding:0 20px;margin:25px 0 13px}
.rh h3{font-size:18px;letter-spacing:-.25px}
.hr{gap:12px;padding:0 20px 5px}
.pc{flex-basis:clamp(112px,34vw,154px)}
.pc .pw{border-radius:15px;background:linear-gradient(145deg,#242936,#11131a);box-shadow:0 7px 18px #0005}
.pc .pt{font-size:12px;color:#d5d7df}
.cc{flex-basis:clamp(112px,31vw,142px)}
.cc .cl{border-radius:14px;background:#f6f6f7;box-shadow:0 7px 18px #0004}
.cc .cn{font-size:12px;color:#e0e2e9}
.sl{border-radius:25px;border:1px solid #ffffff18;box-shadow:0 15px 35px #0007}
.sl .si{padding:18px 17px 20px;gap:9px}
.sl .si b{font-size:clamp(22px,6vw,30px);text-shadow:0 3px 12px #000}
.bw{background:linear-gradient(135deg,#fff,#e7e7eb);border-radius:13px;min-height:48px}
.bt2{border:1px solid #ffffff35;border-radius:13px;min-height:48px}
.sq,#q{background:#151821;border:1px solid #2a2f3c;border-radius:14px;min-height:48px;color:#fff}
.sq{width:calc(100% - 40px);margin:12px 20px 15px}
#body{background:#0c0e14}

button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid #ff5360;outline-offset:2px}

@media(min-width:700px){.hs{padding-left:28px;padding-right:28px}.sl{flex-basis:min(48%,520px)}.gd{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:0 24px}.pc{flex-basis:auto}.cc{flex-basis:150px}.rh{padding:0 28px}.hr{padding-left:28px;padding-right:28px}}

/* ===== FIRAS TV polish pass (v2.1.1): modern black/red theme =====
:root{--bg:#050507;--sel:#241216;--pane:#0e0e12;--red:#f04448;--mu:#a1a1ad;--ok:#48d597}
body{background:var(--bg)}
#hd{padding:12px 18px 6px}
#hb{letter-spacing:-1.4px;text-shadow:0 0 22px #e5393530}
#tabs button{transition:color .18s ease,border-color .18s ease}
#tabs button.on{border-color:var(--red);color:#fff}
#bn{background:rgba(17,17,22,.94);border-color:#29252c;box-shadow:0 12px 38px #0009}
#bn button{transition:background .18s ease,color .18s ease,transform .18s ease}
#bn button.on{background:linear-gradient(145deg,#3a171c,#211015);color:#fff}
#bn button.on .i{color:var(--red)}
.sl{border-color:#33242a;box-shadow:0 8px 30px #0005}
.sl .si{background:linear-gradient(transparent,rgba(0,0,0,.84))}
.bw{background:linear-gradient(135deg,#f04448,#bd222a);color:#fff;box-shadow:0 5px 18px #e5393525}
.bt2{border:1px solid #ffffff18}
.rh h3{letter-spacing:-.2px}

<script>
(function(){
"use strict";

/* =====================================================================
   1) CONFIG
   ===================================================================== */
var APP_NAME='فيراس';                       // غيّر اسم التطبيق من هنا
/* splash: starts first, always disappears (even if something fails later) */
var splashEl=document.getElementById('splash');
document.getElementById('spl').textContent=APP_NAME;
function hideSplash(){if(!splashEl||splashEl.classList.contains('out'))return;splashEl.classList.add('out');var x=splashEl;setTimeout(function(){x.remove()},700)}
splashEl.addEventListener('click',hideSplash);setTimeout(hideSplash,2300);
function showErr(m){
  var b=document.createElement('div');b.textContent='⚠ '+m;
  b.style.cssText='position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:2000;background:#7a1212;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;direction:ltr;word-break:break-word';
  b.onclick=function(){b.remove()};document.body.appendChild(b);setTimeout(function(){b.remove()},9000);
}
window.addEventListener('error',function(e){
  if(!e||!e.message||/^script error\.?$/i.test(e.message))return;   // أخطاء مبهمة من مكتبات خارجية: تُتجاهل
  showErr(e.message);
});
var B='https://iptv-org.github.io/iptv/';
var DEF_CATS=[
 {id:'sports',n:'رياضة',t:'⚽',c:'#5c2d91'},{id:'beinmedia',n:'beIN Media',t:'beIN',c:'#37474f'},
 {id:'canal',n:'CANAL+',t:'C+',c:'#111'},{id:'mbc',n:'MBC',t:'mbc',c:'#b71c1c'},
 {id:'kids',n:'Kids',t:'😊',c:'#fdd835'},{id:'news',n:'News',t:'📰',c:'#e53935'},
 {id:'disc',n:'Discovery',t:'🌍',c:'#2e6b4f'},{id:'rotana',n:'Rotana',t:'R',c:'#2e7d32'},
 {id:'starz',n:'Starzplay',t:'STARZ',c:'#222'},{id:'osn',n:'OSN TV',t:'osn',c:'#e53935'}];
var BRAND_MAP=[[/bein.*media/i,'beinmedia'],[/bein|بي ?ان/i,'sports'],[/alwan|ألوان|الوان/i,'sports'],[/canal/i,'canal'],[/arena/i,'sports'],[/mbc/i,'mbc'],[/rotana|روتانا/i,'rotana'],[/osn/i,'osn'],[/discovery|ديسكفري/i,'disc'],[/starz/i,'starz']];
var BEIN_ORDER=['beIN SPORTS 5','beIN SPORTS 6','beIN SPORTS 7','beIN SPORTS 8','beIN SPORTS 9','beIN SPORTS QATAR','beIN SPORTS NEWS','beIN 4K','beIN SPORTS 1','beIN SPORTS 2','beIN SPORTS 3','beIN SPORTS 4'];
for(var i0=10;i0<=18;i0++)BEIN_ORDER.push('beIN SPORTS '+i0);
for(i0=1;i0<=4;i0++)BEIN_ORDER.push('beIN SPORTS MAX '+i0);
var ARAB=['SA','AE','EG','QA','KW','BH','OM','JO','LB','IQ','SY','PS','YE','LY','TN','DZ','MA','SD'];
var WORLD='AF AL AD AO AR AM AU AT AZ BD BY BE BJ BO BA BR BG BF KH CM CA CL CN CO CR HR CU CY CZ DK DO EC SV EE ET FI FR GE DE GH GR GT HN HK HU IS IN ID IR IE IL IT JM JP KZ KE KG LV LT LU MY ML MT MX MD MN ME MZ NP NL NZ NI NG KP MK NO PK PA PY PE PH PL PT RO RU SN RS SG SK SI SO ZA KR ES LK SE CH TW TJ TZ TH TR TM UG UA GB US UY UZ VE VN ZM ZW'.split(' ');
var PRESETS=[['العربية',B+'languages/ara.m3u'],['الأخبار',B+'categories/news.m3u'],['الرياضة',B+'categories/sports.m3u'],['الأطفال',B+'categories/kids.m3u'],['الأفلام',B+'categories/movies.m3u']];

/* =====================================================================
   2) HELPERS + STORAGE
   ===================================================================== */
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('المساحة ممتلئة، احذف بعض القنوات');return false}}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},2600)}
function safe(u){return /^https?:\/\//i.test(u||'')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function flag(cc){return cc.length===2?String.fromCodePoint(cc.charCodeAt(0)+127397,cc.charCodeAt(1)+127397):'🌍'}
var DN=null;try{DN=new Intl.DisplayNames(['ar'],{type:'region'})}catch(e){}
function cname(cc){try{return DN?DN.of(cc):cc}catch(e){return cc}}
function ccOf(s){var m=(s||'').toUpperCase().match(/[A-Z]{2}/);return m?m[0]:''}
function allCodes(){return ARAB.concat(WORLD.filter(function(k){return ARAB.indexOf(k)<0}))}

/* state */
var ch=ld('fr_ch',null),cats=ld('fr_cats',null),favs=ld('fr_fav',[]),hist=ld('fr_hist',[]),cfg=ld('fr_cfg',{});
function save(){sv('fr_ch',ch);sv('fr_cats',cats);sv('fr_fav',favs);sv('fr_hist',hist);sv('fr_cfg',cfg)}
function byId(id){for(var i=0;i<ch.length;i++)if(ch[i].id===id)return ch[i]}

/* =====================================================================
   3) DATA: logos, classify, parse, add, health-check, migrate
   ===================================================================== */
function beinLogo(n){
  var num=(n.match(/\d+$/)||[''])[0],tag=/MAX/i.test(n)?'MAX':'';
  var sub=/QATAR|NEWS|4K/i.test(n)?n.replace(/^beIN (SPORTS )?/i,''):(tag||'SPORTS');
  var badge=num&&!/4K/i.test(n)?"<rect x='112' y='14' width='28' height='28' rx='5' fill='#5c2d91'/><text x='126' y='35' font-size='20' font-weight='800' text-anchor='middle' fill='#fff' font-family='sans-serif'>"+num+"</text>":'';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90'><rect width='160' height='90' fill='#fff'/><text x='62' y='48' font-size='32' font-weight='900' text-anchor='middle' fill='#5c2d91' font-family='sans-serif'>beIN</text><rect x='14' y='56' width='96' height='20' rx='4' fill='#5c2d91'/><text x='62' y='71' font-size='13' font-weight='700' text-anchor='middle' fill='#fff' font-family='sans-serif'>"+sub+"</text>"+badge+"</svg>");
}
function brandOf(name){for(var i=0;i<BRAND_MAP.length;i++)if(BRAND_MAP[i][0].test(name||''))return BRAND_MAP[i][1];return ''}
function guessCat(s){
  s=(s||'').toLowerCase();
  if(/sport|رياض|ssc|bein|football|kora|كورة|dazn|eurosport/.test(s))return'sports';
  if(/kid|child|cartoon|toon|junior|baraem|spacetoon|أطفال|اطفال|كرتون|سبيستون|براعم|طيور|جيم|nick/.test(s))return'kids';
  if(/news|أخبار|اخبار|جزيرة|عربية|الحدث|cnn|bbc|france ?24|\bdw\b|sky|euronews|رؤيا/.test(s))return'news';
  if(/movie|film|drama|cinema|series|aflam|أفلام|افلام|مسلسل|دراما|سينما/.test(s))return'movies';
  return'misc';
}
function parse(text){
  var out=[],seen={},meta=null;
  String(text).split(/\r?\n/).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    if(l.indexOf('#EXTINF')===0){
      meta={name:l.slice(l.lastIndexOf(',')+1).trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',grp:(l.match(/group-title="([^"]*)"/)||[])[1]||''};return;
    }
    if(l[0]==='#')return;
    var name,url,logo='',grp='';
    if(meta&&safe(l)){name=meta.name;url=l;logo=meta.logo;grp=meta.grp}
    else if(l.indexOf('|')>0){var p=l.split('|');name=p[0].trim();url=p.slice(1).join('|').trim()}
    else if(safe(l)){url=l;name='قناة جديدة'}
    meta=null;
    if(url&&safe(url)&&!seen[url]){seen[url]=1;out.push({name:name||'قناة جديدة',url:url,logo:safe(logo)?logo:'',cat:guessCat(grp+' '+name)})}
  });
  return out;
}
function fetchList(u){
  var ctrl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctrl)ctrl.abort()},20000);
  return fetch(u,ctrl?{signal:ctrl.signal}:{}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('http');return r.text()}).then(parse);
}
/* grp: undefined = classify automatically, string = force that category */
function addChannels(arr,grp,cc,cat){
  var have={};ch.forEach(function(c){if(c.url)have[c.url]=1});
  var added=[];
  arr.forEach(function(c){
    if(!c.url||have[c.url])return;have[c.url]=1;
    c.id=uid();c.alts=c.alts||[];if(cc)c.cc=cc;if(cat)c.cat=cat;
    c.grp=grp!==undefined?grp:brandOf(c.name);
    ch.push(c);added.push(c);
  });
  save();
  if(added.length)setTimeout(function(){checkChannels(added)},400);
  return added.length;
}
/* health check: which channels really answer */
function probe(url){
  return new Promise(function(res){
    var done=false,ctl=window.AbortController?new AbortController():null;
    var t=setTimeout(function(){fin(false)},9000);
    function fin(v){if(done)return;done=true;clearTimeout(t);try{if(ctl)ctl.abort()}catch(e){}res(v)}
    var m3=/\.m3u8?(\?|$)/i.test(url),opt={cache:'no-store'};if(ctl)opt.signal=ctl.signal;
    fetch(url,opt).then(function(r){
      if(!r.ok){fin(false);return}
      if(m3)return r.text().then(function(tx){fin(/#EXTM3U|#EXTINF|#EXT-X/.test(tx.slice(0,2000)))});
      fin(true);
    }).catch(function(){fin(false)});
  });
}
var checking=false;
function checkChannels(list,quiet){
  list=list.filter(function(c){return c.url});
  if(!list.length||checking)return;
  checking=true;
  var i=0,ok=0,bad=0,act=0,tot=list.length;
  function finish(){checking=false;save();toast('انتهى الفحص: ✔ تعمل '+ok+' · ✖ لا تعمل '+bad);renderPage(true);if(admin)drawAdm()}
  function next(){
    while(act<6&&i<tot){
      (function(c){
        act++;
        probe(c.url).then(function(v){
          c.ok=v;c.chk=Date.now();if(v)ok++;else bad++;act--;
          var d=ok+bad;
          if(d===tot)return finish();
          if(!quiet&&d%20===0)toast('فحص القنوات '+d+'/'+tot+' · ✔ '+ok);
          if(d%100===0){save();renderPage(true)}
          next();
        });
      })(list[i++]);
    }
  }
  if(!quiet)toast('جارٍ فحص '+tot+' قناة...');next();
}
/* one-time import of everything saved by the previous versions of the app */
function migrate(){
  var out=[],seen={},old=ld('ftv_ch',[]),own=ld('df_own',{}),oc=ld('df_oc',null);
  var CK={sports:1,movies:1,kids:1,news:1,misc:1};
  if(Array.isArray(old))old.forEach(function(c){
    if(!c||!safe(c.url)||seen[c.url])return;seen[c.url]=1;
    out.push({id:c.id||uid(),name:String(c.name||'قناة'),url:c.url,logo:safe(c.logo)?c.logo:'',cat:CK[c.cat]?c.cat:guessCat(c.name),cc:ccOf(c.cc),
      priv:!!c.priv,alts:Array.isArray(c.alts)?c.alts.filter(safe):[],ok:c.ok,chk:c.chk,grp:brandOf(c.name)});
  });
  var cs=null;
  if(Array.isArray(oc)&&oc.length){cs=oc.map(function(k){return{id:k.id,n:k.n,t:k.t||String(k.n).slice(0,1),c:k.c||'#333'}})}
  Object.keys(own||{}).forEach(function(g){
    (own[g]||[]).forEach(function(c){
      if(!c)return;
      var ex=c.url?out.filter(function(x){return x.url===c.url})[0]:null;
      if(ex){ex.grp=g;return}
      out.push({id:uid(),name:String(c.name||'قناة'),url:safe(c.url)?c.url:'',logo:safe(c.logo)?c.logo:'',cat:guessCat(c.name),cc:'',priv:!!c.priv,alts:Array.isArray(c.alts)?c.alts.filter(safe):[],grp:g});
    });
  });
  if(out.some(function(c){return !c.url&&c.grp==='bein'}))cfg.defB=1;
  ch=out;if(cs)cats=cs;
  var f=[];
  (ld('ftv_fav',[])||[]).forEach(function(id){if(byId(id)&&f.indexOf(id)<0)f.push(id)});
  (ld('df_fav',[])||[]).forEach(function(x){var c=x&&x.url?ch.filter(function(y){return y.url===x.url})[0]:null;if(c&&f.indexOf(c.id)<0)f.push(c.id)});
  favs=f;
  var h=[];(ld('ftv_hist',[])||[]).forEach(function(id){if(byId(id))h.push(id)});hist=h.slice(0,30);
  if(!ld('fr_pw',null)){var op=ld('df_pw',null);if(!op){var cg=ld('ftv_cfg',{});op=cg&&cg.pw?cg.pw:null}if(op)sv('fr_pw',op)}
}
function ensureDefaults(){
  if(!Array.isArray(ch)){ch=[];}
  if(!Array.isArray(cats)||!cats.length)cats=JSON.parse(JSON.stringify(DEF_CATS));
  if(!cfg.defB){
    BEIN_ORDER.forEach(function(n){
      if(!ch.some(function(c){return (c.grp==='sports'||c.grp==='bein')&&c.name.toLowerCase()===n.toLowerCase()}))
        ch.push({id:uid(),name:n,url:'',logo:beinLogo(n),cat:'sports',cc:'QA',grp:'sports',alts:[]});
    });
    cfg.defB=1;
  }
  ch.forEach(function(c){if(!c.logo&&(c.grp==='sports'||c.grp==='bein')&&/^beIN/i.test(c.name))c.logo=beinLogo(c.name)});
}
/* v2: beIN / Arena / Alwan + other sports are merged into ONE «رياضة» category */
function upgradeV2(){
  if(cfg.ver>=2)return;
  var merge={bein:1,arena:1,alwan:1};
  ch.forEach(function(c){if(merge[c.grp])c.grp='sports'});
  cats=cats.filter(function(k){return !merge[k.id]});
  if(!cats.some(function(k){return k.id==='sports'}))cats.unshift({id:'sports',n:'رياضة',t:'⚽',c:'#5c2d91'});
  cfg.ver=2;
}
/* Recover legacy saved channels if the current store is missing or empty. */
if(ch===null||(Array.isArray(ch)&&ch.length===0&&(Array.isArray(ld('ftv_ch',[]))&&ld('ftv_ch',[]).length||Object.keys(ld('df_own',{} )||{}).length))){migrate()}
ensureDefaults();upgradeV2();save();

/* =====================================================================
   4) BROWSER UI: categories, channel list, countries
   ===================================================================== */
var view={t:'cat',id:'sports'},curList=[],shown=0,PAGE=40,loading='',admin=false;
function navItems(){
  return cats.map(function(k){return{id:k.id,n:k.n,t:k.t,c:k.c,v:{t:'cat',id:k.id}}}).concat([

    return rank(x[0])-rank(y[0])||(sp?(isBein(x[0])?0:1)-(isBein(y[0])?0:1):0)||x[1]-y[1]}).map(function(x){return x[0]});

var films={items:[],page:0,more:false,busy:false,done:false,q:'',again:false};
function posterUrl(f){return 'https://archive.org/services/img/'+encodeURIComponent(f.identifier)}
function ensureFilms(){if(!films.items.length&&!films.busy&&!films.done)fetchFilms(true,true)}
function onFilms(){if(page!=='home')return;if(tab==='films')fillFilms();else if(tab==='home')renderHome(true)}
function fetchFilms(reset,silent){
  if(films.busy){if(reset)films.again=true;return}
  if(reset){films.items=[];films.page=0;films.done=false;films.more=false}
  films.busy=true;films.page++;
  if(reset&&!silent)onFilms();
  var term='collection:feature_films AND mediatype:movies'+(films.q?' AND title:('+films.q+')':'');
  var u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(term)+'&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=30&page='+films.page+'&output=json';
  function end(){films.busy=false;films.done=true;if(films.again){films.again=false;fetchFilms(true);return}onFilms()}
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var docs=(d.response&&d.response.docs)||[];
    docs.forEach(function(f){if(f&&f.identifier)films.items.push(f)});
    films.more=docs.length>=30;end();
  }).catch(function(){films.page=Math.max(0,films.page-1);toast('تعذّر تحميل الأفلام، تحقق من الاتصال');end()});
}
function playFilm(f){
  toast('جارٍ تحضير الفيلم...');
  fetch('https://archive.org/metadata/'+encodeURIComponent(f.identifier)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var fl=(d.files||[]).filter(function(x){return /\.mp4$/i.test(x.name)});
    fl.sort(function(a,b){return (b.format==='h.264')-(a.format==='h.264')});
    if(!fl.length){toast('لا يوجد ملف تشغيل لهذا الفيلم');return}
    var path=fl[0].name.split('/').map(encodeURIComponent).join('/');
    curList=[];
    play({id:'f'+f.identifier,name:String(f.title||'فيلم'),film:true,alts:[],
      url:'https://archive.org/download/'+encodeURIComponent(f.identifier)+'/'+path},true);
  }).catch(function(){toast('تعذّر تشغيل الفيلم')});
}

function play(c,keep,ai){

  if(!keep){hist=[c.id].concat(hist.filter(function(x){return x!==c.id})).slice(0,30);sv('fr_hist',hist)}
  destroy();wake();
  var u=ai?c.alts[ai-1]:c.url;
  var failed=false;
  function fail(){
    /* A media error may fire more than once; advance to an alternative only once. */
    if(failed)return;
    failed=true;
    if(tok!==playTok||cur!==c)return;
    if(Array.isArray(c.alts)&&ai<c.alts.length){toast('جارٍ تجربة رابط بديل...');play(c,true,ai+1)}
    else{showMsg('تعذّر تشغيل هذه القناة.\nجرّب قناة أخرى.')}
  }
  failFn=fail;
  if(location.protocol==='https:'&&/^http:/i.test(u)){showMsg('هذه القناة تستخدم رابطاً غير آمن (http) ولا يمكن تشغيلها داخل صفحة https.');return}
  if(/\.m3u8?(\?|$)/i.test(u)&&!window.Hls){
    showMsg('جارٍ تجهيز المشغّل...');
    loadHls().then(function(ok){if(tok!==playTok||cur!==c)return;if(ok)startStream(u,fail);else{showMsg('تعذّر تحميل مشغّل HLS. تحقق من اتصال الإنترنت أو جرّب رابطاً بديلاً.');fail()}});return;
  }
  startStream(u,fail);
}
function startStream(u,fail){

    try{destroy()}catch(x){}

function startStream2(u,fail){
  if(/\.m3u8?(\?|$)/i.test(u)&&window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:2,fragLoadingMaxRetry:3});
    var activeHls=hls,activeToken=playTok;
    hls.on(Hls.Events.ERROR,function(_,d){

      if(activeHls!==hls||activeToken!==playTok)return;

      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&retry<3){retry++;hls.recoverMediaError();return}
      fail();
    });

  }else{v.src=u}

}

function inp(ph,val,cls){var i=el('input',cls||'');i.placeholder=ph;i.value=val||'';return i}
function catName(id){var k=cats.filter(function(x){return x.id===id})[0];return k?k.n:'بدون تصنيف'}
function editCh(c){if(!admin)return;aEdit=c;aCat=c.grp||'';if(!$('#adm').classList.contains('show'))$('#adm').classList.add('show');drawAdm()}
function openAdm(){if(!admin)return;$('#adm').classList.add('show');drawAdm()}
function closeAdm(){$('#adm').classList.remove('show');drawNav();renderPage(true)}
function aList(){
  var q=aQ.toLowerCase();
  return ch.filter(function(c){return aCat==='*'||(aCat===''?!c.grp:c.grp===aCat)}).filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>-1});
}
function targetGrp(){return (aCat===''||aCat==='*')?undefined:aCat}
function drawAdm(){
  if(!admin)return;
  var a=$('#adm'),keepY=a.scrollTop;a.textContent='';
  var h=el('h2','','لوحة الإدارة');var x=el('button','','✕');x.onclick=closeAdm;h.appendChild(x);a.appendChild(h);

  /* stats */
  var w=0,d=0,u=0;ch.forEach(function(c){if(!c.url)return;if(c.ok===true)w++;else if(c.ok===false)d++;else u++});
  a.appendChild(el('div','stat','القنوات: '+ch.length+'  ·  ✔ تعمل '+w+'  ·  ✖ معطلة '+d+'  ·  لم تُفحص '+u));

  /* category */
  a.appendChild(el('h4','','التصنيف'));
  var sel=el('select');
  cats.map(function(k){return[k.id,k.n]}).concat([['','— بدون تصنيف —'],['*','— كل القنوات —']]).forEach(function(p){
    var n=ch.filter(function(c){return p[0]==='*'||(p[0]===''?!c.grp:c.grp===p[0])}).length;
    var o=el('option','',p[1]+' ('+n+')');o.value=p[0];if(p[0]===aCat)o.selected=true;sel.appendChild(o);
  });
  sel.onchange=function(){aCat=sel.value;aEdit=null;aQ='';drawAdm()};a.appendChild(sel);
  a.appendChild(btn('＋ تصنيف جديد',function(){
    var n=prompt('اسم التصنيف');if(!n||!n.trim())return;
    var id='c'+Date.now().toString(36);cats.push({id:id,n:n.trim().slice(0,30),t:n.trim().slice(0,1).toUpperCase(),c:'#333'});save();aCat=id;drawNav();drawAdm();
  },'g'));
  var cc0=cats.filter(function(k){return k.id===aCat})[0];
  if(cc0){
    a.appendChild(btn('✎ اسم التصنيف',function(){var n=prompt('الاسم الجديد',cc0.n);if(n&&n.trim()){cc0.n=n.trim().slice(0,30);save();drawNav();drawAdm()}},'g'));
    a.appendChild(btn('🗑 حذف التصنيف',function(){
      if(!confirm('حذف التصنيف "'+cc0.n+'"؟ (قنواته تبقى بدون تصنيف)'))return;
      ch.forEach(function(c){if(c.grp===cc0.id)c.grp=''});cats=cats.filter(function(k){return k!==cc0});
      if(view.t==='cat'&&view.id===cc0.id)view={t:'all'};aCat='';save();drawNav();drawAdm();
    },'d'));
  }

  /* channels */
  a.appendChild(el('h4','','القنوات'));
  var s=inp('بحث في هذا التصنيف...',aQ);s.onchange=function(){aQ=s.value;drawAdm()};a.appendChild(s);
  var arr=aList();
  arr.slice(0,100).forEach(function(c){
    var r=el('div','rw');r.appendChild(el('span','',c.name));
    var stt=!c.url?['بدون رابط','']:c.ok===true?['● تعمل','ok']:c.ok===false?['✖ معطلة','bad']:['لم تُفحص',''];
    r.appendChild(el('small',stt[1],stt[0]));
    var e=el('button','','✎');e.onclick=function(){aEdit=c;drawAdm()};
    var dl=el('button','','🗑');dl.onclick=function(){if(confirm('حذف "'+c.name+'"؟')){ch.splice(ch.indexOf(c),1);favs=favs.filter(function(f){return f!==c.id});hist=hist.filter(function(f){return f!==c.id});if(aEdit===c)aEdit=null;save();drawAdm()}};
    r.appendChild(e);r.appendChild(dl);a.appendChild(r);
  });
  if(arr.length>100)a.appendChild(el('div','stat','يظهر أول 100 من '+arr.length+' — استخدم البحث'));
  a.appendChild(btn('＋ إضافة قناة',function(){aEdit={};drawAdm()}));

  /* edit form */
  if(aEdit){
    var c=aEdit,isNew=ch.indexOf(c)<0;
    a.appendChild(el('h4','',isNew?'قناة جديدة':'تعديل القناة'));
    var n=inp('اسم القناة',c.name),u2=inp('رابط البث https://...m3u8',c.url,'u'),l=inp('رابط الشعار (اختياري)',c.logo,'u'),cc=inp('رمز الدولة مثل SA (اختياري)',c.cc,'u');
    var al=el('textarea');al.placeholder='روابط بديلة (رابط في كل سطر)';al.value=(c.alts||[]).join('\n');
    var gs=el('select');cats.map(function(k){return[k.id,k.n]}).concat([['','— بدون تصنيف —']]).forEach(function(p){var o=el('option','',p[1]);o.value=p[0];if(p[0]===(c.grp||(isNew&&targetGrp()?targetGrp():'')))o.selected=true;gs.appendChild(o)});
    var pv2=el('label','','🔒 قناة خاصة (تظهر للأدمن فقط)');pv2.style.cssText='display:flex;align-items:center;margin-bottom:10px;direction:rtl';var pk=el('input');pk.type='checkbox';pk.checked=!!c.priv;pv2.insertBefore(pk,pv2.firstChild);
    [n,u2,l,cc,al,gs,pv2].forEach(function(e){a.appendChild(e)});
    a.appendChild(btn('حفظ',function(){
      var nm=n.value.trim(),ur=u2.value.trim(),lg=l.value.trim(),ccv=ccOf(cc.value),alts=al.value.split(/\n+/).map(function(z){return z.trim()}).filter(Boolean);
      if(!nm)return toast('اكتب اسم القناة');
      if(ur&&!safe(ur))return toast('رابط البث غير صالح');
      if(lg&&!safe(lg))return toast('رابط الشعار غير صالح');
      if(alts.some(function(z){return !safe(z)}))return toast('أحد الروابط البديلة غير صالح');
      if(c.url!==ur)c.ok=undefined;
      c.name=nm;c.url=ur;c.logo=lg||(/^beIN/i.test(nm)?beinLogo(nm):'');c.cc=ccv;c.alts=alts;c.grp=gs.value;c.priv=pk.checked;
      if(isNew){c.id=uid();c.cat=guessCat(nm);ch.push(c)}
      save();aEdit=null;toast('تم الحفظ');drawAdm();
    }));
    a.appendChild(btn('إلغاء',function(){aEdit=null;drawAdm()},'g'));
  }

  /* استيراد القنوات أزيل من لوحة الإدارة حسب طلب المستخدم. */

  /* health */
  a.appendChild(el('h4','','فحص القنوات'));
  a.appendChild(btn('✔ فحص هذا التصنيف',function(){checkChannels(aList())}));
  a.appendChild(btn('فحص كل القنوات',function(){if(confirm('فحص '+ch.length+' قناة قد يستغرق وقتاً. متابعة؟'))checkChannels(ch)},'g'));
  a.appendChild(btn('🗑 حذف المعطلة',function(){
    var n=ch.filter(function(c){return c.url&&c.ok===false}).length;if(!n)return toast('لا توجد قنوات معطلة');
    if(!confirm('حذف '+n+' قناة معطلة نهائياً؟'))return;
    ch=ch.filter(function(c){return !(c.url&&c.ok===false)});favs=favs.filter(byId);hist=hist.filter(byId);save();drawAdm();
  },'d'));

  /* backup + account */
  a.appendChild(el('h4','','النسخ الاحتياطي والحساب'));
  a.appendChild(btn('📋 نسخ البيانات',function(){var j=JSON.stringify({ch:ch,cats:cats,favs:favs});if(navigator.clipboard)navigator.clipboard.writeText(j).then(function(){toast('تم النسخ')},function(){prompt('انسخ البيانات',j)});else prompt('انسخ البيانات',j)},'g'));
  a.appendChild(btn('📥 استعادة',function(){
    var t=prompt('الصق البيانات المنسوخة');if(!t)return;
    try{var d=JSON.parse(t);if(!Array.isArray(d.ch)||!Array.isArray(d.cats))throw 0;ch=d.ch;cats=d.cats;favs=Array.isArray(d.favs)?d.favs:[];save();toast('تمت الاستعادة');drawNav();drawAdm()}catch(e){toast('البيانات غير صالحة')}
  },'g'));
  a.appendChild(btn('🔑 تغيير كلمة المرور',function(){
    askPw('كلمة المرور الحالية',false,function(cur0){chkPw(cur0,ld('fr_pw',null)).then(function(ok){
      if(!ok){failed();return toast('كلمة المرور الحالية خاطئة')}
      askPw('كلمة المرور الجديدة (10 أحرف على الأقل، أحرف وأرقام)',true,function(nw){
        if(!strong(nw))return toast('كلمة المرور ضعيفة');mkPw(nw).then(function(o){sv('fr_pw',o);toast('تم التغيير')})})})});
  },'g'));
  a.appendChild(btn('تسجيل خروج',logout,'d'));
  a.scrollTop=keepY;
}
