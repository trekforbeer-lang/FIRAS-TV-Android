name: Deploy Firebase Football Function

on:
  workflow_dispatch:

jobs:
  deploy-football-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Firebase project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAHMANI_TV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_RAHMANI_TV"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy footballFixtures
        run: firebase deploy --only functions:footballFixtures --project rahmani-tv --non-interactive

      - name: Verify deployed footballFixtures endpoint
        env:
          FOOTBALL_TEST_DATE: ${{ github.event.repository.updated_at }}
        run: |
          DATE="$(date -u +%F)"
          URL="https://europe-west1-rahmani-tv.cloudfunctions.net/footballFixtures?date=$DATE&timezone=Europe%2FMadrid"
          CODE="$(curl --silent --show-error --output response.json --write-out '%{http_code}' "$URL")"
          echo "footballFixtures HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Endpoint verification failed:"
            cat response.json
            exit 1
          fi
          node -e "const d=require('./response.json'); if (!Array.isArray(d.response)) process.exit(1); console.log('Valid API-Football response; fixtures:', d.response.length)"
