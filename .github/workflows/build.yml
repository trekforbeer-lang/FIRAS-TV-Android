name: FIRAS TV v4 Build APK
# Build includes the latest committed admin-patch Kotlin sources, RAHMANI UI resources, and saved-channel screen.
on:
  push:
    branches: [kotlin-v3, fix/restore-channels-background-parse]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore FIRAS TV Kotlin source and native admin
        shell: bash
        run: |
          set -euo pipefail
          cat .github/workflows/v4-source-*.b64 | base64 --decode | tar -xJf -
          # Preserve the tracked channel catalog before replacing the archived app source.
          cp app/src/main/assets/channels.json .github/admin-patch/channels.json
          rm -rf app/src/main
          cp -a FIRAS_TV_ULTIMATE/. .
          rm -rf FIRAS_TV_ULTIMATE
          rm -f .github/workflows/v4-source-*.b64
          cp .github/admin-patch/AdminActivity.kt app/src/main/java/com/firas/tv/AdminActivity.kt
          cp .github/admin-patch/MainActivity.kt app/src/main/java/com/firas/tv/MainActivity.kt
          cp .github/admin-patch/CountriesActivity.kt app/src/main/java/com/firas/tv/CountriesActivity.kt
          cp .github/admin-patch/FavoriteChannels.kt app/src/main/java/com/firas/tv/FavoriteChannels.kt # saved-channel screen and favorites
          cp .github/admin-patch/DiscoverActivity.kt app/src/main/java/com/firas/tv/DiscoverActivity.kt # channel discovery and category search
          cp .github/admin-patch/MoreActivity.kt app/src/main/java/com/firas/tv/MoreActivity.kt # dedicated More hub
          cp .github/admin-patch/Models.kt app/src/main/java/com/firas/tv/Models.kt
          cp .github/admin-patch/UniversalStreamEngine.kt app/src/main/java/com/firas/tv/UniversalStreamEngine.kt
          cp .github/admin-patch/ChannelAdapter.kt app/src/main/java/com/firas/tv/ChannelAdapter.kt
          cp .github/admin-patch/activity_main.xml app/src/main/res/layout/activity_main.xml
          cp .github/admin-patch/activity_player.xml app/src/main/res/layout/activity_player.xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values app/src/main/res/color
          cp .github/admin-patch/colors.xml app/src/main/res/values/colors.xml
          cp .github/admin-patch/dimens.xml app/src/main/res/values/dimens.xml
          cp .github/admin-patch/themes.xml app/src/main/res/values/themes.xml
          cp .github/admin-patch/styles.xml app/src/main/res/values/styles.xml
          cp .github/admin-patch/strings.xml app/src/main/res/values/strings.xml
          cp .github/admin-patch/home_hero_bg.xml app/src/main/res/drawable/home_hero_bg.xml
          cp .github/admin-patch/search_bg.xml app/src/main/res/drawable/search_bg.xml
          cp .github/admin-patch/rahmani_action_button.xml app/src/main/res/drawable/rahmani_action_button.xml
          cp .github/admin-patch/rahmani_primary_button.xml app/src/main/res/drawable/rahmani_primary_button.xml
          cp .github/admin-patch/rahmani_action_card.xml app/src/main/res/drawable/rahmani_action_card.xml
          cp .github/admin-patch/rahmani_panel_bg.xml app/src/main/res/drawable/rahmani_panel_bg.xml
          cp .github/admin-patch/rahmani_icon_tile.xml app/src/main/res/drawable/rahmani_icon_tile.xml
          cp .github/admin-patch/rahmani_nav_capsule.xml app/src/main/res/drawable/rahmani_nav_capsule.xml
          cp .github/admin-patch/rahmani_nav_item_bg.xml app/src/main/res/drawable/rahmani_nav_item_bg.xml
          cp .github/admin-patch/rahmani_card_stroke.xml app/src/main/res/drawable/rahmani_card_stroke.xml
          cp .github/admin-patch/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp .github/admin-patch/MoviesActivity.kt app/src/main/java/com/firas/tv/MoviesActivity.kt
          cp .github/admin-patch/SportsActivity.kt app/src/main/java/com/firas/tv/SportsActivity.kt
          cp .github/admin-patch/TeamPreferencesActivity.kt app/src/main/java/com/firas/tv/TeamPreferencesActivity.kt
          cp .github/admin-patch/PlayerActivity.kt app/src/main/java/com/firas/tv/PlayerActivity.kt
          cp .github/admin-patch/MoviePlayerActivity.kt app/src/main/java/com/firas/tv/MoviePlayerActivity.kt
          mkdir -p app/src/main/assets
          cp .github/admin-patch/channels.json app/src/main/assets/channels.json
          cp .github/admin-patch/countries.csv app/src/main/assets/countries.csv
          # RAHMANI architecture dependencies and modern Android configuration.
          sed -i 's/minSdk = 21/minSdk = 24/' app/build.gradle.kts
          sed -i -E 's/targetSdk = [0-9]+/targetSdk = 34/' app/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.kapt") version "2.0.21" apply false' build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.kapt")' app/build.gradle.kts
          sed -i '/^android[[:space:]]*{/a\    buildFeatures { viewBinding = true }' app/build.gradle.kts
          sed -i '/implementation("androidx.appcompat:appcompat:1.7.0")/a\    implementation("androidx.activity:activity-ktx:1.10.0")\n    implementation("androidx.fragment:fragment-ktx:1.8.5")\n    implementation("androidx.constraintlayout:constraintlayout:2.2.0")\n    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")\n    implementation("androidx.viewpager2:viewpager2:1.1.0")\n    implementation("androidx.navigation:navigation-fragment-ktx:2.8.5")\n    implementation("androidx.navigation:navigation-ui-ktx:2.8.5")\n    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")\n    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")\n    implementation("androidx.room:room-runtime:2.6.1")\n    implementation("androidx.room:room-ktx:2.6.1")\n    kapt("androidx.room:room-compiler:2.6.1")\n    implementation("androidx.paging:paging-runtime-ktx:3.3.5")\n    implementation("androidx.datastore:datastore-preferences:1.1.1")\n    implementation("io.coil-kt:coil:2.7.0")' app/build.gradle.kts
          grep -q 'minSdk = 24' app/build.gradle.kts
          grep -q 'targetSdk = 34' app/build.gradle.kts
          grep -q 'viewBinding = true' app/build.gradle.kts
          grep -q 'androidx.navigation:navigation-fragment-ktx:2.8.5' app/build.gradle.kts
          grep -q 'room-compiler:2.6.1' app/build.gradle.kts
          grep -q 'okhttp:4.12.0' app/build.gradle.kts
          # Render SVG channel logos natively on Android (PNG/JPEG remain supported).
          # Admin-picked logo files are stored in app-private storage and decoded locally.
          sed -i '/^dependencies[[:space:]]*{/a\    implementation("com.caverock:androidsvg-aar:1.4")' app/build.gradle.kts
          grep -q 'com.caverock:androidsvg-aar:1.4' app/build.gradle.kts
          sed -i '/implementation("androidx.recyclerview:recyclerview:1.3.2")/a\    implementation("androidx.work:work-runtime-ktx:2.9.1")' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime-ktx:2.9.1' app/build.gradle.kts
          # The archived v4 source still declares Media3 1.3.1. Align every
          # Media3 module before compiling so ExoPlayer/UI/OkHttp stay in sync.
          sed -i -E 's#(androidx\.media3:[^:]+):[0-9.]+#\1:1.5.1#g' app/build.gradle.kts
          grep -q 'media3-exoplayer:1.5.1' app/build.gradle.kts
          grep -q 'media3-ui:1.5.1' app/build.gradle.kts
          sed -i '/implementation("androidx.media3:media3-ui:1.5.1")/a\    implementation("androidx.media3:media3-session:1.5.1")' app/build.gradle.kts
          grep -q 'media3-session:1.5.1' app/build.gradle.kts
          grep -q 'media3-datasource-okhttp:1.5.1' app/build.gradle.kts
          # Media3 1.5.1 requires compileSdk 35; AGP 8.6.1 supports it with Gradle 8.7.
          sed -i 's/id("com.android.application") version "8.5.2"/id("com.android.application") version "8.6.1"/' build.gradle.kts
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 35/' app/build.gradle.kts
          grep -q 'version "8.6.1"' build.gradle.kts
          grep -q 'compileSdk = 35' app/build.gradle.kts
          ! grep -R '127.0.0.1' app/src/main
          # Normalize the APK version for this v4 build, regardless of the
          # previous source bundle's versionCode.
          sed -i -E 's/versionCode = [0-9]+/versionCode = 406/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "4.0.6"/' app/build.gradle.kts
          grep -q 'versionCode = 406' app/build.gradle.kts
          grep -q 'versionName = "4.0.6"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RAHMANI-ANDROID-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rahmani-android-${{ github.run_number }}
          name: RAHMANI Android (Build ${{ github.run_number }})
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
