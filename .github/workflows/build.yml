name: FIRAS TV v4 Build APK
on:
  push:
    branches: [kotlin-v3]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore FIRAS TV v4 source
        shell: bash
        run: |
          cat .github/workflows/v4-source-*.b64 | base64 --decode | tar -xJf -
          rm -rf app/src/main
          cp -a FIRAS_TV_ULTIMATE/. .
          rm -rf FIRAS_TV_ULTIMATE
          rm -f .github/workflows/v4-source-*.b64
          # Apply maintained admin-panel source patch after restoring the archived app.
          cp .github/admin-patch/ChannelStore.kt app/src/main/java/com/firas/tv/ChannelStore.kt
          cp .github/admin-patch/AdminActivity.kt app/src/main/java/com/firas/tv/AdminActivity.kt
          cp .github/admin-patch/MainActivity.kt app/src/main/java/com/firas/tv/MainActivity.kt
          cp .github/admin-patch/AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i 's/UniversalStreamEngine.loadLegacy(this)/ChannelStore.loadLegacy(this)/' app/src/main/java/com/firas/tv/PlayerActivity.kt
          # Ensure this build upgrades over the previous v4 test build.
          grep -q 'versionCode = 40' app/build.gradle.kts
          sed -i 's/versionCode = 40/versionCode = 401/' app/build.gradle.kts
          grep -q 'versionCode = 401' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIRAS-TV-APK-v4-admin
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firas-tv-v4-admin-build-${{ github.run_number }}
          name: FIRAS TV v4 Admin (Build ${{ github.run_number }})
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
