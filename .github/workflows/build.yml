name: FIRAS TV Android Build
on:
  push:
    branches: [kotlin-v3]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease
      - name: Upload single installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRAS-TV-APK-v3.0.3
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firas-tv-v3.0.3-build-${{ github.run_number }}
          name: FIRAS TV v3.0.3 (Build ${{ github.run_number }})
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
