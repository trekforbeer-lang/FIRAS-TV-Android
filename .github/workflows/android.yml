name: FIRAS TV APK

on:
  push:
    branches: [main, FIRAS-TV-Android, rahmani-tv-maintenance-fix-2026-11-26]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk" || { echo "APK missing or empty: $apk"; exit 1; }
          size=$(stat -c '%s' "$apk")
          echo "APK size: $size bytes"
          if [ "$size" -lt 1048576 ]; then
            echo "Refusing to publish an unexpectedly small APK (<1 MiB). Check whether the full app assets/source were included."
            exit 1
          fi
          unzip -t "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAHMANI-TV-2.2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
